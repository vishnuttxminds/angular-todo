<div class="container">
  <mat-card>
    <mat-card-title>Add New Post</mat-card-title>
    <form [formGroup]="postForm" (ngSubmit)="addPost()">
      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Title</mat-label>
        <input matInput formControlName="title" required>
      </mat-form-field>

      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Body</mat-label>
        <textarea matInput formControlName="body" required></textarea>
      </mat-form-field>

      <button mat-raised-button color="primary" type="submit" [disabled]="!postForm.valid">Add Post</button>
    </form>
  </mat-card>

  <mat-card class="post-list">
    <mat-card-title>Posts</mat-card-title>
    <mat-list>
      <mat-list-item *ngFor="let post of posts">
        <div class="post-content">
          <h3>{{ post.title }}</h3>
          <p>{{ post.body }}</p>
        </div>
        <button mat-icon-button color="warn" (click)="deletePost(post.id!)">
          <mat-icon>delete</mat-icon>
        </button>
      </mat-list-item>
    </mat-list>
  </mat-card>
</div>
